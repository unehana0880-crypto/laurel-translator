<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Laurel Translator · 매장 응대용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F5F0;
    --bg-card: #FFFFFF;
    --bg-accent: #EFE8DD;
    --ink: #2C2419;
    --ink-soft: #6B6052;
    --ink-faint: #A89E8E;
    --line: #E4DCCD;
    --gold: #B89968;
    --gold-deep: #8B6F3F;
    --green-leaf: #5C7A5C;
    --warning: #C4634A;
    --shadow: 0 1px 3px rgba(44, 36, 25, 0.06), 0 8px 24px rgba(44, 36, 25, 0.04);
    --radius: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: 0 0 40px;
  }

  /* HEADER */
  .header {
    padding: 28px 20px 16px;
    text-align: center;
    background: linear-gradient(180deg, #FFFFFF 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--line);
    position: relative;
  }

  .header::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -1px;
    transform: translateX(-50%);
    width: 60px;
    height: 1px;
    background: var(--gold);
  }

  .brand-mark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.32em;
    color: var(--gold-deep);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .brand-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 28px;
    letter-spacing: 0.04em;
    color: var(--ink);
    line-height: 1;
  }

  .brand-sub {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 6px;
    letter-spacing: 0.04em;
  }

  /* MAIN CONTAINER */
  .container {
    max-width: 540px;
    margin: 0 auto;
    padding: 16px;
  }

  /* LANGUAGE PICKER */
  .lang-section {
    margin-bottom: 16px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-left: 4px;
  }

  .lang-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }

  .lang-btn {
    aspect-ratio: 1.4;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    padding: 4px;
  }

  .lang-btn:active { transform: scale(0.96); }

  .lang-btn.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }

  .lang-btn.active .lang-flag,
  .lang-btn.active .lang-name { color: var(--bg); }

  .lang-flag {
    font-size: 20px;
    line-height: 1;
  }

  .lang-name {
    font-size: 9.5px;
    color: var(--ink-soft);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .lang-more {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px dashed var(--line);
    border-radius: var(--radius-sm);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .lang-more.active {
    background: var(--ink);
    border: 1px solid var(--ink);
    border-style: solid;
    box-shadow: 0 2px 8px rgba(44, 36, 25, 0.2);
  }

  .lang-more.active select {
    color: var(--bg);
    font-weight: 700;
  }

  .lang-more select {
    background: transparent;
    border: none;
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    width: 100%;
    text-align: center;
    text-align-last: center;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    outline: none;
  }

  .lang-more select option {
    color: var(--ink);
    background: var(--bg-card);
    font-weight: 500;
  }

  /* DIRECTION TOGGLE */
  .direction-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }

  .dir-side {
    flex: 1;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .dir-side strong {
    display: block;
    font-size: 15px;
    color: var(--ink);
    margin-top: 2px;
    font-weight: 700;
  }

  .dir-swap {
    width: 38px;
    height: 38px;
    background: var(--bg-accent);
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--gold-deep);
    font-size: 16px;
    transition: transform 0.3s;
  }

  .dir-swap:active { transform: rotate(180deg); }

  /* INPUT AREA */
  .input-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }

  .input-textarea {
    width: 100%;
    min-height: 90px;
    border: none;
    resize: none;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink);
    background: transparent;
    outline: none;
  }

  .input-textarea::placeholder {
    color: var(--ink-faint);
  }

  .input-toolbar {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }

  .tool-btn {
    flex: 1;
    padding: 12px;
    border: 1px solid var(--line);
    background: var(--bg-card);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
  }

  .tool-btn:active { transform: scale(0.97); }

  .tool-btn.primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .tool-btn.mic.recording {
    background: var(--warning);
    color: white;
    border-color: var(--warning);
    animation: pulse 1.4s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .tool-btn.claude {
    background: var(--bg-accent);
    color: var(--gold-deep);
    border-color: var(--gold);
  }

  .tool-btn .icon { font-size: 14px; }

  /* OUTPUT AREA */
  .output-card {
    background: linear-gradient(180deg, #FFFFFF 0%, #FAF6F0 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    min-height: 120px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    position: relative;
  }

  .output-engine-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    background: var(--bg-accent);
    padding: 3px 8px;
    border-radius: 100px;
  }

  .output-engine-badge.claude {
    color: var(--gold-deep);
    background: rgba(184, 153, 104, 0.12);
  }

  .output-text {
    font-size: 19px;
    line-height: 1.55;
    color: var(--ink);
    font-weight: 400;
    padding-right: 60px;
    word-break: break-word;
  }

  .output-text.empty {
    color: var(--ink-faint);
    font-style: italic;
    font-size: 14px;
    font-weight: 300;
  }

  .output-toolbar {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  .output-toolbar button {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--line);
    background: var(--bg-card);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .output-toolbar button:active { transform: scale(0.96); }

  /* QUICK PHRASES */
  .quick-section {
    margin-top: 20px;
  }

  .quick-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }

  .quick-tabs::-webkit-scrollbar { display: none; }

  .quick-tab {
    flex-shrink: 0;
    padding: 8px 14px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 100px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
  }

  .quick-tab.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .quick-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .quick-item {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: all 0.15s;
  }

  .quick-item:active {
    background: var(--bg-accent);
    transform: scale(0.99);
  }

  .quick-item-ko {
    font-size: 14px;
    color: var(--ink);
    font-weight: 500;
    line-height: 1.4;
  }

  .quick-item-sub {
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-top: 4px;
    font-style: italic;
    line-height: 1.4;
  }

  /* LOADING */
  .loading {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }

  .loading span {
    width: 6px;
    height: 6px;
    background: var(--gold);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .loading span:nth-child(2) { animation-delay: 0.2s; }
  .loading span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink);
    color: var(--bg);
    padding: 12px 20px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    transition: transform 0.3s;
    z-index: 100;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(44, 36, 25, 0.3);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* FOOTER */
  .footer {
    text-align: center;
    margin-top: 24px;
    padding: 16px;
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }


  /* VIEW TABS + STUDY (암기장) */
  .view-tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:16px; }
  .view-tab { padding:12px; border:1px solid var(--line); background:var(--bg-card); border-radius:var(--radius-sm); font-family:inherit; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .view-tab.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .st-head { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px; }
  .st-head .section-label { margin-bottom:0; }
  .st-streak { font-size:12px; color:var(--ink-soft); }
  .st-streak b { font-family:'Cormorant Garamond',serif; font-size:24px; color:var(--gold-deep); margin:0 3px; font-weight:500; }
  .st-row { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; }
  .st-row::-webkit-scrollbar { display:none; }
  .st-pill { flex-shrink:0; padding:9px 14px; border:1px solid var(--line); background:var(--bg-card); border-radius:100px; font-family:inherit; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
  .st-pill small { opacity:.7; margin-left:5px; font-size:10px; }
  .st-pill.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .st-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:12px; }
  .st-tab { padding:11px 6px; border:1px solid var(--line); background:var(--bg-card); border-radius:var(--radius-sm); font-family:inherit; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
  .st-tab.active { background:var(--bg-accent); color:var(--gold-deep); border-color:var(--gold); }
  .st-card { background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px; }
  .st-cat { font-size:10px; font-weight:700; letter-spacing:0.18em; color:var(--gold-deep); text-transform:uppercase; }
  .st-ko { font-size:19px; line-height:1.5; font-weight:500; }
  .st-fx { font-size:21px; line-height:1.5; word-break:break-word; }
  .st-pr { font-size:15px; color:var(--ink-soft); line-height:1.5; word-break:break-word; }
  .st-ans { border-top:1px solid var(--line); padding-top:14px; display:flex; flex-direction:column; gap:8px; }
  .st-btn { padding:14px; border:1px solid var(--ink); background:var(--ink); color:var(--bg); border-radius:var(--radius-sm); font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; }
  .st-btn.soft { background:var(--bg-accent); color:var(--gold-deep); border-color:var(--gold); }
  .st-btn.warn { background:#fff; color:var(--warning); border-color:var(--warning); }
  .st-btn[disabled] { opacity:0.4; cursor:default; }
  .st-btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .st-spk { align-self:flex-start; padding:9px 18px; border:1px solid var(--line); background:var(--bg-card); border-radius:100px; font-family:inherit; font-size:12px; font-weight:700; color:var(--ink); cursor:pointer; }
  .st-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .st-stat { background:var(--bg); border-radius:var(--radius-sm); padding:12px 6px; text-align:center; }
  .st-stat b { display:block; font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:500; color:var(--ink); }
  .st-stat span { font-size:11px; color:var(--ink-soft); }
  .st-prog { height:5px; background:var(--bg-accent); border-radius:3px; overflow:hidden; }
  .st-prog i { display:block; height:100%; background:var(--gold); }
  .st-big { font-family:'Cormorant Garamond',serif; font-size:44px; color:var(--gold-deep); line-height:1; }
  .st-opts { display:flex; flex-direction:column; gap:8px; }
  .st-opt { width:100%; text-align:left; padding:12px 14px; border:1px solid var(--line); background:var(--bg-card); border-radius:var(--radius-sm); font-family:inherit; font-size:15px; line-height:1.4; color:var(--ink); cursor:pointer; word-break:break-word; }
  .st-opt.right { border-color:var(--green-leaf); background:#EEF4EE; }
  .st-opt.wrong { border-color:var(--warning); background:#FBEDE8; }
  .st-item { border-top:1px solid var(--line); padding-top:12px; display:flex; flex-direction:column; gap:2px; cursor:pointer; }
  .st-item .k { font-size:12px; color:var(--ink-faint); }
  .st-item .f { font-size:16px; word-break:break-word; }
  .st-item .p { font-size:13px; color:var(--ink-soft); word-break:break-word; }
  .st-cover .f, .st-cover .p { filter:blur(7px); user-select:none; }
  .st-cover.show .f, .st-cover.show .p { filter:none; user-select:auto; }
  .st-chk { font-size:10px; color:var(--green-leaf); margin-left:6px; font-weight:700; }
  .st-sw { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-soft); }
  .st-sw select { font-family:inherit; font-size:13px; padding:6px; border:1px solid var(--line); border-radius:8px; background:var(--bg-card); color:var(--ink); }
  .st-note { font-size:11px; color:var(--ink-faint); line-height:1.6; }

  /* SMALL SCREEN */
  @media (max-width: 380px) {
    .lang-grid { grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .lang-flag { font-size: 18px; }
    .lang-name { font-size: 8.5px; }
    .output-text { font-size: 17px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="brand-mark">Laurel Studio</div>
  <div class="brand-title">Translator</div>
  <div class="brand-sub">매장 응대용 · in-store translator</div>
</header>

<div class="container">

  <!-- VIEW TABS -->
  <div class="view-tabs">
    <button class="view-tab active" id="vtTr" onclick="showView('translate')">번역기</button>
    <button class="view-tab" id="vtSt" onclick="showView('study')">외국어 암기장</button>
  </div>

  <div id="viewTranslate">

  <!-- LANGUAGE PICKER -->
  <div class="lang-section">
    <div class="section-label">Language · 대상 언어</div>
    <div class="lang-grid" id="langGrid"></div>
    <div class="lang-more">
      <select id="langExtra">
        <option value="">+ 다른 언어 선택...</option>
      </select>
    </div>
  </div>

  <!-- DIRECTION -->
  <div class="direction-bar">
    <div class="dir-side">
      From<strong id="dirFrom">한국어</strong>
    </div>
    <button class="dir-swap" onclick="swapDirection()" title="방향 전환">⇄</button>
    <div class="dir-side">
      To<strong id="dirTo">English</strong>
    </div>
  </div>

  <!-- INPUT -->
  <div class="input-card">
    <textarea class="input-textarea" id="inputText" placeholder="여기에 입력하거나 마이크 버튼을 누르세요" oninput="autoTranslate()"></textarea>
    <div class="input-toolbar">
      <button class="tool-btn mic" id="micBtn" onclick="toggleMic()">
        <span class="icon">🎙</span><span id="micLabel">음성</span>
      </button>
      <button class="tool-btn" onclick="clearInput()">
        <span class="icon">✕</span>지우기
      </button>
      <button class="tool-btn primary" onclick="translate()">
        번역
      </button>
    </div>
  </div>

  <!-- OUTPUT -->
  <div class="output-card">
    <div class="output-engine-badge" id="engineBadge">GOOGLE</div>
    <div class="output-text empty" id="outputText">번역 결과가 여기에 표시됩니다</div>
    <div class="output-toolbar">
      <button onclick="speak()" ondblclick="showAvailableVoices()" title="더블클릭: 사용 가능한 음성 확인">🔊 듣기</button>
      <button onclick="copyOutput()">📋 복사</button>
      <button class="tool-btn claude" style="flex:1;padding:10px;font-size:11px;" onclick="translateWithClaude()">✦ Claude로 재번역</button>
    </div>
  </div>

  <!-- QUICK PHRASES -->
  <div class="quick-section">
    <div class="section-label">Quick Phrases · 빠른 문장</div>
    <div class="quick-tabs" id="quickTabs"></div>
    <div class="quick-list" id="quickList"></div>
  </div>

  </div><!-- /viewTranslate -->

  <!-- STUDY (외국어 암기장) -->
  <div id="viewStudy" hidden>
    <div class="st-head">
      <div class="section-label">Study · 암기할 언어</div>
      <div class="st-streak">연속<b id="stStreak">0</b>일</div>
    </div>
    <div class="st-row" id="stLangs"></div>
    <div class="st-tabs" id="stTabs">
      <button class="st-tab active" data-v="study">학습</button>
      <button class="st-tab" data-v="quiz">퀴즈</button>
      <button class="st-tab" data-v="list">전체 목록</button>
    </div>
    <div class="st-card" id="stMain"></div>
    <p class="st-note" style="margin-top:12px">한글 발음은 근사치입니다. 진도는 이 기기의 브라우저에 저장됩니다.</p>
  </div>

  <div class="footer">
    LAUREL STUDIO · HONGDAE, SEOUL
  </div>

function renderLangs() {
  const grid = document.getElementById('langGrid');
  const extra = document.getElementById('langExtra');
  const extraWrap = document.querySelector('.lang-more');
  grid.innerHTML = '';
  extra.innerHTML = '<option value="">+ 다른 언어 선택...</option>';

  let isSubSelected = false;

  Object.entries(LANGS).forEach(([key, lang]) => {
    if (lang.primary) {
      const btn = document.createElement('button');
      btn.className = 'lang-btn' + (key === currentTargetLang ? ' active' : '');
      btn.dataset.lang = key;
      btn.innerHTML = `<div class="lang-flag">${lang.flag}</div><div class="lang-name">${lang.label}</div>`;
      btn.onclick = () => selectLang(key);
      grid.appendChild(btn);
    } else {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = `${lang.flag} ${lang.name}`;
      if (key === currentTargetLang) {
        opt.selected = true;
        isSubSelected = true;
      }
      extra.appendChild(opt);
    }
  });

  if (isSubSelected) {
    extraWrap.classList.add('active');
  } else {
    extraWrap.classList.remove('active');
  }

  extra.onchange = (e) => {
    if (e.target.value) selectLang(e.target.value);
  };
}

function selectLang(key) {
  currentTargetLang = key;
  renderLangs();
  updateDirectionLabels();
  if (document.getElementById('inputText').value.trim()) {
    autoTranslate();
  }
}

function updateDirectionLabels() {
  const lang = LANGS[currentTargetLang];
  if (currentDirection === 'ko-to-foreign') {
    document.getElementById('dirFrom').textContent = '한국어';
    document.getElementById('dirTo').textContent = lang.name;
    document.getElementById('inputText').placeholder = '한국어로 입력하거나 마이크 버튼을 누르세요';
  } else {
    document.getElementById('dirFrom').textContent = lang.name;
    document.getElementById('dirTo').textContent = '한국어';
    document.getElementById('inputText').placeholder = `${lang.name}로 입력하거나 마이크 버튼을 누르세요`;
  }
}

function swapDirection() {
  currentDirection = currentDirection === 'ko-to-foreign' ? 'foreign-to-ko' : 'ko-to-foreign';
  const input = document.getElementById('inputText');
  const output = document.getElementById('outputText');
  const tmpVal = input.value;
  const tmpOut = output.classList.contains('empty') ? '' : output.textContent;
  input.value = tmpOut;
  if (tmpVal) {
    output.classList.remove('empty');
    output.textContent = tmpVal;
  } else {
    output.classList.add('empty');
    output.textContent = '번역 결과가 여기에 표시됩니다';
  }
  updateDirectionLabels();
  if (input.value.trim()) autoTranslate();
}

function renderQuickTabs() {

  Object.keys(QUICK).forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'quick-tab' + (cat === currentCategory ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => {
      currentCategory = cat;
      renderQuickTabs();
      renderQuickList();

function renderQuickList() {

    let html = `<div class="quick-item-ko">${item.ko}</div>`;
    if (item.en) html += `<div class="quick-item-sub">${item.en}</div>`;
    btn.innerHTML = html;
    btn.onclick = () => {
      document.getElementById('inputText').value = item.ko;
      // 빠른 문장은 항상 한국어 → 외국어
      if (currentDirection !== 'ko-to-foreign') {
        currentDirection = 'ko-to-foreign';
        updateDirectionLabels();
      }
      // 미리 준비된 영문이 있고 대상이 영어면 → 그 영문 그대로 표시 (구글 번역 안 함)

        showResult(item.en, 'LAUREL');
      } else {
        translate();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    list.appendChild(btn);
  });
}

async function translate() {
  const input = document.getElementById('inputText').value.trim();
  if (!input) {
    showToast('번역할 텍스트를 입력해주세요');
    return;
  }

  const fromLang = currentDirection === 'ko-to-foreign' ? 'ko' : LANGS[currentTargetLang].google;
  const toLang = currentDirection === 'ko-to-foreign' ? LANGS[currentTargetLang].google : 'ko';

  showLoading('GOOGLE');

  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${fromLang}&tl=${toLang}&dt=t&q=${encodeURIComponent(input)}`;
    const res = await fetch(url);
    const data = await res.json();
    const translated = data[0].map(item => item[0]).join('');
    showResult(translated, 'GOOGLE');
  } catch (e) {
    showResult('번역 실패. Claude 재번역을 눌러주세요.', 'ERROR');
  }
}

function autoTranslate() {
  clearTimeout(translateTimer);
  const input = document.getElementById('inputText').value.trim();
  if (!input) {
    document.getElementById('outputText').classList.add('empty');
    document.getElementById('outputText').textContent = '번역 결과가 여기에 표시됩니다';
    return;
  }
  translateTimer = setTimeout(translate, 600);
}

// ============================================
// TRANSLATE — Claude (refined)
// ============================================
async function translateWithClaude() {
  const input = document.getElementById('inputText').value.trim();
  if (!input) {
    showToast('번역할 텍스트를 입력해주세요');
    return;
  }

  const fromLang = currentDirection === 'ko-to-foreign' ? '한국어' : LANGS[currentTargetLang].name;
  const toLang = currentDirection === 'ko-to-foreign' ? LANGS[currentTargetLang].name : '한국어';

  showLoading('CLAUDE');

  const prompt = `You are a professional translator for a high-end Korean K-Beauty skincare studio called Laurel Studio in Hongdae, Seoul. The studio serves international guests.

Translate the following ${fromLang} text into natural, warm ${toLang}, in a tone appropriate for a refined skincare studio. Keep it concise and natural — like how a real esthetician would speak. Do not add explanations, only the translation.

Text: "${input}"

Translation:`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    let result = data.content.filter(c => c.type === 'text').map(c => c.text).join('').trim();
    result = result.replace(/^["']|["']$/g, '').replace(/^Translation:\s*/i, '').trim();
    showResult(result, 'CLAUDE');
  } catch (e) {
    showResult('Claude 번역 실패. Google 번역을 사용해보세요.', 'ERROR');
  }
}

// ============================================
// SPEECH SYNTHESIS (음성 출력)
// ============================================
let availableVoices = [];
let voicesLoaded = false;

function loadVoices() {
  try {
    const synth = window.speechSynthesis || speechSynthesis;
    if (!synth || typeof synth.getVoices !== 'function') return;
    availableVoices = synth.getVoices() || [];
    if (availableVoices.length > 0) {
      voicesLoaded = true;
    }
  } catch (e) {
    availableVoices = [];
  }
}

try {
  if (window.speechSynthesis) {
    loadVoices();
    if (typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }
    setTimeout(loadVoices, 100);
    setTimeout(loadVoices, 500);
    setTimeout(loadVoices, 1000);
  }
} catch (e) {
  console.log('Speech synthesis not available:', e);
}

function findBestVoice(targetLang) {
  if (availableVoices.length === 0) {
    loadVoices();
  }
  let voice = availableVoices.find(v => v.lang === targetLang);
  if (voice) return voice;
  const langCode = targetLang.split('-')[0];
  voice = availableVoices.find(v => v.lang.startsWith(langCode + '-'));
  if (voice) return voice;
  voice = availableVoices.find(v => v.lang.toLowerCase().startsWith(langCode.toLowerCase()));
  return voice || null;
}

function speak() {
  const out = document.getElementById('outputText');
  if (out.classList.contains('empty')) {
    showToast('읽을 내용이 없습니다');
    return;
  }

  let synth;
  try {
    synth = window.speechSynthesis || speechSynthesis;
  } catch (e) {
    synth = null;
  }

  if (!synth || typeof synth.speak !== 'function') {
    showToast('이 브라우저는 음성 출력을 지원하지 않습니다');
    return;
  }

  const text = out.textContent;
  const voiceLang = currentDirection === 'ko-to-foreign' ? LANGS[currentTargetLang].voice : 'ko-KR';

  if (availableVoices.length === 0) {
    try {
      availableVoices = synth.getVoices() || [];
    } catch (e) {
      availableVoices = [];
    }
    if (availableVoices.length === 0) {
      setTimeout(() => speak(), 250);
      return;
    }
  }

  const voice = findBestVoice(voiceLang);

  try { synth.cancel(); } catch (e) {}

  const utter = new SpeechSynthesisUtterance(text);
  if (voice) {
    utter.voice = voice;
    utter.lang = voice.lang;
  } else {
    utter.lang = voiceLang;
  }
  utter.rate = 0.92;
  utter.pitch = 1.0;
  utter.volume = 1.0;

  utter.onerror = (e) => {
    const errMsg = e.error || 'unknown';
    if (errMsg === 'not-allowed') {
      showToast('음성 권한이 차단되어 있습니다');
    } else if (errMsg === 'language-unavailable' || errMsg === 'voice-unavailable') {
      const langName = currentDirection === 'ko-to-foreign' ? LANGS[currentTargetLang].name : '한국어';
      showToast(`${langName} 음성이 기기에 설치되지 않았습니다`);
    } else {
      showToast('음성 출력 실패: ' + errMsg);
    }
  };

  setTimeout(() => {
    try {
      synth.speak(utter);
    } catch (err) {
      showToast('음성 재생 실패: ' + (err.message || err));
    }
  }, 50);
}

function showAvailableVoices() {
  loadVoices();
  if (availableVoices.length === 0) {
    showToast('음성 목록을 불러올 수 없습니다');
    return;
  }
  const voiceLang = currentDirection === 'ko-to-foreign' ? LANGS[currentTargetLang].voice : 'ko-KR';
  const langCode = voiceLang.split('-')[0];
  const matched = availableVoices.filter(v => v.lang.toLowerCase().startsWith(langCode.toLowerCase()));
  const total = availableVoices.length;

  let msg = `전체 음성: ${total}개\n`;
  if (matched.length > 0) {
    msg += `${LANGS[currentTargetLang]?.name || '현재 언어'} 음성: ${matched.length}개 사용 가능 ✓`;
  } else {
    msg += `${LANGS[currentTargetLang]?.name || '현재 언어'} 음성: 설치 안 됨 ✗`;
  }
  alert(msg + '\n\n전체 목록:\n' + availableVoices.map(v => `${v.lang} - ${v.name}`).join('\n'));
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ============================================
// SPEECH RECOGNITION (음성 입력)
// ============================================
function setupSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById('micBtn').style.display = 'none';
    return;
  }
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'ko-KR';

  recognition.onresult = (e) => {
    let text = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      text += e.results[i][0].transcript;
    }
    document.getElementById('inputText').value = text;
    if (e.results[e.results.length - 1].isFinal) {
      translate();
    }
  };

  recognition.onerror = (e) => {
    stopMic();
    if (e.error === 'not-allowed') {
      showToast('마이크 권한을 허용해주세요');
    } else {
      showToast('음성 인식 실패');
    }
  };

  recognition.onend = () => stopMic();
}

function toggleMic() {
  if (!recognition) return;
  if (isRecording) {
    recognition.stop();
  } else {
    const lang = currentDirection === 'ko-to-foreign' ? 'ko-KR' : LANGS[currentTargetLang].voice;
    recognition.lang = lang;
    try {
      recognition.start();
      isRecording = true;
      document.getElementById('micBtn').classList.add('recording');
      document.getElementById('micLabel').textContent = '듣는중';
    } catch (e) {
      showToast('마이크 시작 실패');
    }
  }
}

function stopMic() {
  isRecording = false;
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('micLabel').textContent = '음성';
}

var KEY="laurel-study-v1", S={};
try{ S=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ S={}; }
S=Object.assign({cards:{},nt:{d:"",n:{}},streak:{last:"",n:0},perDay:5,lang:"en",auto:true},S);
if(!S.nt||typeof S.nt.n!=="object") S.nt={d:"",n:{}};
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function dkey(off){ var d=new Date(); d.setDate(d.getDate()+(off||0)); var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function el(id){ return document.getElementById(id); }

// 번역기와 같은 음성 선택 로직(findBestVoice, availableVoices)을 그대로 사용
function say(text,lang,retry){
  var synth=null;
  try{ synth=window.speechSynthesis; }catch(e){}
  if(!synth||typeof synth.speak!=="function"){ showToast("이 브라우저는 음성 출력을 지원하지 않습니다"); return; }
  if(availableVoices.length===0){
    try{ availableVoices=synth.getVoices()||[]; }catch(e){ availableVoices=[]; }
    if(availableVoices.length===0&&!retry){ setTimeout(function(){ say(text,lang,true); },250); return; }
  }
  var v=findBestVoice(lang);
  try{ synth.cancel(); }catch(e){}
  var u=new SpeechSynthesisUtterance(text);
  if(v){ u.voice=v; u.lang=v.lang; } else { u.lang=lang; }
  u.rate=0.92; u.pitch=1.0; u.volume=1.0;
  u.onerror=function(e){
    var m=e.error||"unknown";
    if(m==="language-unavailable"||m==="voice-unavailable") showToast(DECKS[S.lang].label+" 음성이 기기에 설치되지 않았습니다");
    else if(m==="not-allowed") showToast("음성 권한이 차단되어 있습니다");
    else showToast("음성 출력 실패: "+m);
  };
  setTimeout(function(){ try{ synth.speak(u); }catch(err){ showToast("음성 재생 실패"); } },50);
}

var view="study", sess=null, qz=null, hideList=true;

function counts(lang){
  var today=dkey(), due=0, neu=0, learned=0, cs=DECKS[lang].cards;
  cs.forEach(function(c){ var st=S.cards[c.id]; if(!st) neu++; else { if(st.due<=today) due++; if(st.b>=3) learned++; } });
  var used=(S.nt.d===today)?(S.nt.n[lang]||0):0, left=Math.max(0,S.perDay-used);
  return {due:due,neu:neu,newAvail:Math.min(neu,left),learned:learned,total:cs.length};
}
function spk(){ return '<button class="st-spk" data-act="speak">듣기</button>'; }

function renderHead(){
  var box=el("stLangs"); box.innerHTML="";
  Object.keys(DECKS).forEach(function(k){
    var c=counts(k), b=document.createElement("button");
    b.className="st-pill"+(S.lang===k?" active":""); b.dataset.lang=k;
    b.innerHTML=esc(DECKS[k].label)+"<small>"+c.learned+"/"+c.total+"</small>"; box.appendChild(b);
  });
  document.querySelectorAll("#stTabs .st-tab").forEach(function(t){ t.classList.toggle("active",t.dataset.v===view); });
  var st=S.streak; el("stStreak").textContent=(st.last===dkey()||st.last===dkey(-1))?st.n:0;
}

  var main=el("stMain"), d=DECKS[S.lang], c=counts(S.lang);
  if(sess&&sess.queue.length===0){
    main.innerHTML='<div class="st-cat">오늘 학습 끝</div><div class="st-big">'+sess.done+'장</div><div class="st-ko">'+esc(d.label)+' 카드를 외웠어요.</div>'+
      '<div class="st-btns"><button class="st-btn" data-act="home">처음으로</button><button class="st-btn soft" data-act="tab-quiz">퀴즈 풀기</button></div>';
    return;
  }
  if(sess){
    var cur=sess.queue[0], pct=Math.round(100*sess.done/Math.max(1,sess.n));
    var h='<div class="st-prog"><i style="width:'+pct+'%"></i></div><div class="st-cat">'+esc(cur.cat)+' · 남은 '+sess.queue.length+'장</div><div class="st-ko">'+esc(cur.ko)+'</div>';
    if(!sess.reveal){
      h+='<button class="st-btn" data-act="reveal">정답 보기</button><div class="st-note">먼저 외국어로 소리 내어 말해 본 뒤 눌러 보세요.</div>';
    }else{
      h+='<div class="st-ans"><div class="st-fx">'+esc(cur.t)+'</div><div class="st-pr">'+esc(cur.p)+'</div>'+spk()+'</div>'+
         '<div class="st-btns"><button class="st-btn warn" data-act="again">다시</button><button class="st-btn" data-act="good">외웠어요</button></div>';
    }
    main.innerHTML=h; return;
  }
  var total=c.due+c.newAvail;
  main.innerHTML=
    '<div class="st-stats"><div class="st-stat"><b>'+c.newAvail+'</b><span>오늘 새 카드</span></div><div class="st-stat"><b>'+c.due+'</b><span>복습할 카드</span></div><div class="st-stat"><b>'+c.learned+'</b><span>외운 카드</span></div></div>'+
    '<button class="st-btn" data-act="start"'+(total?"":" disabled")+'>'+(total?esc(d.label)+" 오늘 학습 시작 ("+total+"장)":"오늘 분량을 모두 마쳤어요")+'</button>'+
    '<label class="st-sw">하루 새 카드 <select id="stPer"><option>3</option><option>5</option><option>8</option><option>10</option></select>장</label>'+
    '<label class="st-sw"><input type="checkbox" id="stAuto"'+(S.auto?" checked":"")+'> 정답을 보면 음성 자동 재생</label>'+
    '<div class="st-note">"외웠어요"를 누른 카드는 1일, 3일, 7일, 14일, 30일 뒤에 다시 나옵니다. "다시"를 누르면 오늘 안에 한 번 더 나옵니다.</div>';
  el("stPer").value=String(S.perDay);
}

function startSession(){
  var today=dkey(), cs=DECKS[S.lang].cards, due=[], neu=[];
  cs.forEach(function(c){ var st=S.cards[c.id]; if(!st) neu.push(c); else if(st.due<=today) due.push(c); });
  var used=(S.nt.d===today)?(S.nt.n[S.lang]||0):0, left=Math.max(0,S.perDay-used);
  var q=shuffle(due).concat(neu.slice(0,left));
  sess={queue:q,n:q.length,done:0,reveal:false};
}
function rate(good){
  var today=dkey(), c=sess.queue.shift(), st=S.cards[c.id];
  if(!st){ if(S.nt.d!==today) S.nt={d:today,n:{}}; S.nt.n[S.lang]=(S.nt.n[S.lang]||0)+1; st={b:0,due:today}; }
  if(good){ st.b=Math.min(st.b+1,5); st.due=dkey(INT[st.b]); sess.done++; }
  else { st.b=0; st.due=today; sess.queue.push(c); }
  S.cards[c.id]=st;
  if(good){ var s=S.streak; if(s.last!==today){ s.n=(s.last===dkey(-1))?s.n+1:1; s.last=today; } }
  sess.reveal=false; save();
}

function startQuiz(){
  var cs=DECKS[S.lang].cards, qs=shuffle(cs).slice(0,10).map(function(c){
    var others=shuffle(cs.filter(function(x){return x.id!==c.id;})).slice(0,3);
    return {c:c,opts:shuffle(others.concat([c]))};
  });
  qz={qs:qs,i:0,score:0,pick:null};
}
function renderQuiz(){
  var main=el("stMain"), d=DECKS[S.lang];
  if(!qz){
    main.innerHTML='<div class="st-cat">퀴즈</div><div class="st-ko">한국어를 보고 알맞은 '+esc(d.label)+' 문장을 고르세요.</div><button class="st-btn" data-act="qstart">'+Math.min(10,d.cards.length)+'문제 시작</button>';
    return;
  }
  if(qz.i>=qz.qs.length){
    main.innerHTML='<div class="st-cat">결과</div><div class="st-big">'+qz.score+' / '+qz.qs.length+'</div><div class="st-btns"><button class="st-btn" data-act="qstart">다시 풀기</button><button class="st-btn soft" data-act="qend">닫기</button></div>';
    return;
  }
  var q=qz.qs[qz.i], h='<div class="st-prog"><i style="width:'+Math.round(100*qz.i/qz.qs.length)+'%"></i></div><div class="st-cat">'+(qz.i+1)+' / '+qz.qs.length+'</div><div class="st-ko">'+esc(q.c.ko)+'</div><div class="st-opts">';
  q.opts.forEach(function(o,i){
    var cls="st-opt"; if(qz.pick!==null){ if(o.id===q.c.id) cls+=" right"; else if(i===qz.pick) cls+=" wrong"; }
    h+='<button class="'+cls+'" data-act="pick" data-i="'+i+'"'+(qz.pick!==null?" disabled":"")+'>'+esc(o.t)+'</button>';
  });
  h+='</div>';
  if(qz.pick!==null){ h+='<div class="st-pr">'+esc(q.c.p)+'</div>'+spk()+'<button class="st-btn" data-act="qnext">'+(qz.i+1>=qz.qs.length?"결과 보기":"다음")+'</button>'; }
  main.innerHTML=h;
}

function renderList(){
  var d=DECKS[S.lang], cats=[], h='<label class="st-sw"><input type="checkbox" id="stHide"'+(hideList?" checked":"")+'> 외국어 가리기 (줄을 누르면 보이고 소리가 나요)</label>';
  d.cards.forEach(function(c){ if(cats.indexOf(c.cat)<0) cats.push(c.cat); });
  cats.forEach(function(cat){
    h+='<div class="st-cat">'+esc(cat)+'</div>';
    d.cards.forEach(function(c,idx){
      if(c.cat!==cat) return;
      var st=S.cards[c.id], mark=(st&&st.b>=3)?'<span class="st-chk">외움</span>':"";
      h+='<div class="st-item'+(hideList?" st-cover":"")+'" data-act="row" data-i="'+idx+'"><span class="k">'+esc(c.ko)+mark+'</span><span class="f">'+esc(c.t)+'</span><span class="p">'+esc(c.p)+'</span></div>';
    });
  });
  el("stMain").innerHTML=h;
}

function render(){
  renderHead();
  if(view==="study") renderStudy(); else if(view==="quiz") renderQuiz(); else renderList();
}
window.studyRender=render;

var root=el("viewStudy");
root.addEventListener("click",function(e){
  var t=e.target.closest("[data-lang],[data-v],[data-act]"); if(!t) return;
  if(t.dataset.lang){ S.lang=t.dataset.lang; sess=null; qz=null; save(); render(); return; }
  if(t.dataset.v){ view=t.dataset.v; render(); return; }
  var a=t.dataset.act, d=DECKS[S.lang];
  if(a==="start"){ startSession(); }
  else if(a==="reveal"){ sess.reveal=true; if(S.auto) say(sess.queue[0].t,d.sp); }
  else if(a==="good"){ rate(true); }
  else if(a==="again"){ rate(false); }
  else if(a==="home"){ sess=null; }
  else if(a==="tab-quiz"){ sess=null; view="quiz"; }
  else if(a==="speak"){
    var txt=null;
    if(view==="study"&&sess&&sess.queue[0]) txt=sess.queue[0].t;
    if(view==="quiz"&&qz&&qz.qs[qz.i]) txt=qz.qs[qz.i].c.t;
    if(txt) say(txt,d.sp);
    return;
  }
  else if(a==="qstart"){ startQuiz(); }
  else if(a==="qend"){ qz=null; }
  else if(a==="pick"){ var q=qz.qs[qz.i]; qz.pick=+t.dataset.i; if(q.opts[qz.pick].id===q.c.id) qz.score++; if(S.auto) say(q.c.t,d.sp); }
  else if(a==="qnext"){ qz.i++; qz.pick=null; }
  else if(a==="row"){
    t.classList.toggle("show");
    if(t.classList.contains("show")) say(d.cards[+t.dataset.i].t,d.sp);
    return;
  }
  render();
});
root.addEventListener("change",function(e){
  if(e.target.id==="stPer"){ S.perDay=+e.target.value; save(); render(); }
  if(e.target.id==="stAuto"){ S.auto=e.target.checked; save(); }
  if(e.target.id==="stHide"){ hideList=e.target.checked; render(); }
});
render();

})();

// ============================================
// START
// ============================================
init();
</script>
